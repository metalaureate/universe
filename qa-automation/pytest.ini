[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=qa-automation/reports/test_report.html
    --self-contained-html
markers =
    smoke: Smoke tests that verify basic functionality
    regression: Regression tests for existing features
    ui: UI interaction tests
    mining: Mining-related tests
    settings: Settings and configuration tests
    slow: Tests that take a long time to run
